# Keep Android debug builds viable on machines with limited available RAM.
# The previous 8 GB heap / 4 GB metaspace reservation prevented Gradle from
# starting when Android Studio, Flutter, and an emulator were already running.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
org.gradle.parallel=false
kotlin.daemon.jvmargs=-Xmx512m
# Kotlin's incremental cache cannot serialize paths between the C: Pub cache
# and this project on E:. Compile plugins non-incrementally to avoid that cache.
kotlin.incremental=false
android.useAndroidX=true
# Use Android Studio's bundled JBR (Java 21) — satisfies AGP Java 17+ requirement
org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr
